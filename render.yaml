# Render deployment for Urban Food Delivery Intelligence (existing Flask app).
services:
  - type: web
    name: urban-food-delivery-intelligence
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt && python -m mining.precompute_comparison
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 2 --timeout 120
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.7
      # MySQL is optional: the app uses its DataFrame warehouse fallback when
      # these are unset. Set them only if you provision a managed database.
      # - key: MYSQL_HOST
      #   sync: false
      # - key: MYSQL_PORT
      #   value: 3306
      # - key: MYSQL_USER
      #   sync: false
      # - key: MYSQL_PASSWORD
      #   sync: false
      # - key: MYSQL_DB
      #   value: urban_food_dw
